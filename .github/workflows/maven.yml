# Build Java scraper, export Next.js site, publish docs to GitHub Pages,
# and deploy the static site to Cloudflare Pages on Main.

name: Java CI with Maven

on:
    workflow_dispatch:
    schedule:
        - cron: "0 9 * * *"
    push:
        branches:
            - main

concurrency:
    group: bing-wallpaper-ci-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: write

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Set up JDK 21
              uses: actions/setup-java@v6
              with:
                  java-version: "21"
                  distribution: temurin
                  cache: maven

            - name: Build with Maven
              run: mvn -B package --file pom.xml

            - name: Run Java application
              run: java -jar target/bing-wallpaper-jar-with-dependencies.jar

            - name: Set up Node.js 26
              uses: actions/setup-node@v7
              with:
                  node-version: "26"
                  package-manager-cache: false

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: nextjs-app/package.json

            - name: Install Next.js dependencies
              working-directory: nextjs-app
              run: bun install --frozen-lockfile

            - name: Build Next.js application
              working-directory: nextjs-app
              run: bun run build

            - name: Copy Next.js build to docs
              run: |
                  rm -rf docs/*
                  cp -r nextjs-app/out/* docs/
                  touch docs/.nojekyll

            - name: Deploy to Cloudflare Pages
              if: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
              uses: cloudflare/wrangler-action@v3
              with:
                  apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
                  accountId: "36cc5642d2d603e7486c6345407d2550"
                  command: pages deploy nextjs-app/out --project-name=bing-wallpaper --branch=main --commit-dirty=true

            - name: Commit and push changes
              run: |
                  git config user.name "Cactus (Bot)"
                  git config user.email "79493862+erbanku@users.noreply.github.com"
                  git add README.md bing-wallpaper.md picture/ docs/
                  if git diff --staged --quiet; then
                    echo "No changes to commit"
                  else
                    git commit -m "chore: update readme and rebuild site [skip ci]"
                    git push
                  fi
