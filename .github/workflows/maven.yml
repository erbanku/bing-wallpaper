# Build Java scraper, export Next.js site, and publish docs to GitHub Pages.
# Cloudflare Pages builds from this GitHub repo on push to main (see AGENTS.md).

name: Java CI with Maven

on:
    workflow_dispatch:
    schedule:
        - cron: "0 9 * * *"

permissions:
    contents: write

jobs:
    build:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v7
              with:
                  token: ${{ secrets.GITHUB_TOKEN }}

            - name: Set up JDK 21
              uses: actions/setup-java@v6
              with:
                  java-version: "21"
                  distribution: temurin
                  cache: maven

            - name: Build with Maven
              run: mvn -B package --file pom.xml

            - name: Run Java application
              run: java -jar target/bing-wallpaper-jar-with-dependencies.jar

            - name: Set up Node.js 26
              uses: actions/setup-node@v7
              with:
                  node-version: "26"
                  package-manager-cache: false

            - name: Set up Bun
              uses: oven-sh/setup-bun@v2
              with:
                  bun-version-file: nextjs-app/package.json

            - name: Install Next.js dependencies
              working-directory: nextjs-app
              run: bun install --frozen-lockfile

            - name: Build Next.js application
              working-directory: nextjs-app
              run: bun run build

            - name: Copy Next.js build to docs
              run: |
                  rm -rf docs/*
                  cp -r nextjs-app/out/* docs/
                  touch docs/.nojekyll

            - name: Commit and push changes
              run: |
                  git config user.name "Cactus (Bot)"
                  git config user.email "79493862+erbanku@users.noreply.github.com"
                  git add README.md bing-wallpaper.md picture/ docs/
                  if git diff --staged --quiet; then
                    echo "No changes to commit"
                  else
                    git commit -m "chore: update readme and rebuild site"
                    git push
                  fi
